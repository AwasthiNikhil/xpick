<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafaf9;
      --surface: #f1f1ee;
      --line: #e3e3df;
      --ink: #18181b;
      --muted: #5e6068;
      --accent: #1f5eff;
      --accent-ink: #ffffff;
      --accent-text: #1a4fd6;
      --accent-soft: #e8eeff;
      --amber: #a14b06;
      --amber-soft: #fef3e2;
      --red: #b42318;
      --red-soft: #fdecea;
      --kbd-on-accent: rgb(255 255 255 / 0.2);
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171a;
        --surface: #212328;
        --line: #30333a;
        --ink: #ecedef;
        --muted: #a2a5ad;
        --accent: #6e95ff;
        --accent-ink: #0b1020;
        --accent-text: #9db7ff;
        --accent-soft: #1d2645;
        --amber: #f5b04a;
        --amber-soft: #2c2213;
        --red: #ff9a90;
        --red-soft: #2e1816;
        --kbd-on-accent: rgb(0 0 0 / 0.18);
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled, input:disabled { cursor: not-allowed; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    kbd {
      padding: 0 5px; border: 1px solid var(--line); border-radius: 4px;
      background: var(--surface); color: var(--ink); font: 11px var(--mono);
    }
    section { padding: 14px 16px; border-top: 1px solid var(--line); }

    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; }
    .brand { display: flex; align-items: center; gap: 8px; color: var(--accent); }
    h1 { margin: 0; color: var(--ink); font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .status::before { content: ""; width: 6px; height: 6px; border: 1.5px solid currentColor; border-radius: 50%; box-sizing: border-box; }
    .status[data-on="true"] { padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
    .status[data-on="true"]::before { border: 0; background: var(--accent); }

    .inspect { padding-top: 0; border-top: 0; display: flex; flex-direction: column; gap: 8px; }
    .notice { margin: 0 0 2px; padding: 9px 11px; border-radius: 8px; background: var(--surface); font-size: 12.5px; }
    .actions { display: flex; gap: 8px; }
    .actions button { display: flex; align-items: center; height: 40px; border-radius: 8px; }
    .actions button:disabled { opacity: 0.45; }
    #toggleBtn { flex: 1 1 auto; gap: 8px; padding: 0 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    #toggleBtn:hover:not(:disabled) { filter: brightness(1.08); }
    #toggleBtn[data-on="true"] { background: var(--ink); color: var(--bg); }
    #toggleLabel { flex: 1 1 auto; text-align: left; }
    #toggleKey { border: 0; background: var(--kbd-on-accent); color: inherit; padding: 1px 6px; }
    #toggleBtn[data-on="true"] #toggleKey { background: rgb(127 127 127 / 0.25); }
    #freezeBtn { flex: none; gap: 6px; padding: 0 11px; border: 1px solid var(--line); background: transparent; font-weight: 500; }
    #freezeBtn:hover:not(:disabled) { background: var(--surface); }
    .keys { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }

    label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 600; }
    .field {
      display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 6px 0 10px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    }
    .field:focus-within { border-color: var(--accent); }
    .field[data-state="ok"] { border-color: var(--amber); }
    .field[data-state="error"] { border-color: var(--red); }
    .field:has(input:disabled) { opacity: 0.45; }
    #queryInput { flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent; font: 12px var(--mono); }
    #queryInput::placeholder { color: var(--muted); }
    #queryChip { flex: none; padding: 3px 8px; border-radius: 5px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
    #queryChip:empty { display: none; }
    .field[data-state="ok"] #queryChip { border: 1.5px dashed var(--amber); background: var(--amber-soft); color: var(--amber); }
    .field[data-state="error"] #queryChip { background: var(--red-soft); color: var(--red); }
    #queryNote { margin: 6px 0 0; min-height: 16px; font-size: 11.5px; color: var(--muted); }

    .recent { padding: 12px 8px 8px; }
    .recent-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 6px; }
    h2 { margin: 0; font-size: 12px; font-weight: 600; }
    .link { padding: 2px 4px; border: 0; background: none; color: var(--muted); font-size: 12px; }
    .link:hover { color: var(--ink); text-decoration: underline; }
    #history { list-style: none; margin: 0; padding: 0; max-height: 230px; overflow-y: auto; }
    #history button {
      width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 8px;
      border: 0; border-radius: 7px; background: transparent; text-align: left;
    }
    #history button:hover, #history button:focus-visible { background: var(--surface); }
    .tag { flex: none; width: 38px; font: 500 10.5px var(--mono); color: var(--muted); }
    .tag[data-tag="xpath"] { color: var(--accent-text); }
    .tag[data-tag="css"] { color: var(--ink); }
    .entry { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    .value { font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon { flex: none; color: var(--muted); opacity: 0; }
    #history button:hover .icon, #history button:focus-visible .icon, [data-copied] .icon { opacity: 1; }
    [data-copied] .meta, [data-copied] .icon { color: var(--accent-text); }
    .empty { margin: 0; padding: 4px 8px; font-size: 12.5px; color: var(--muted); }

    footer {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
    }
    #shortcutChange { color: var(--accent-text); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      <h1>XPick</h1>
    </div>
    <span id="status" class="status" data-on="false">Off</span>
  </header>

  <section class="inspect" aria-label="Inspector">
    <p id="notice" class="notice" role="alert" hidden></p>
    <div class="actions">
      <button id="toggleBtn" data-on="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <span id="toggleLabel">Inspect</span>
        <kbd id="toggleKey" hidden></kbd>
      </button>
      <button id="freezeBtn" title="Starts inspecting in 3 seconds, so you can open a hover menu first">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
        In 3s
      </button>
    </div>
    <ul class="keys" aria-label="Keys while inspecting">
      <li><kbd>C</kbd> XPath</li>
      <li><kbd>⇧C</kbd> Full path</li>
      <li><kbd>S</kbd> CSS</li>
      <li><kbd>↑↓←→</kbd> Move</li>
    </ul>
  </section>

  <section>
    <label for="queryInput">Test a locator</label>
    <div id="queryField" class="field">
      <input id="queryInput" placeholder="XPath or CSS selector" spellcheck="false" autocomplete="off" aria-describedby="queryChip queryNote">
      <output id="queryChip" aria-live="polite"></output>
    </div>
    <p id="queryNote"></p>
  </section>

  <section class="recent" aria-labelledby="historyTitle">
    <div class="recent-head">
      <h2 id="historyTitle">Recent</h2>
      <button id="clearHistory" class="link" hidden>Clear</button>
    </div>
    <ul id="history"></ul>
  </section>

  <footer>
    <span>Test bar on page <kbd id="testKey">not set</kbd></span>
    <button id="shortcutChange" class="link">Edit shortcuts</button>
  </footer>

  <script src="inject.js"></script>
  <script src="popup.js"></script>
</body>
</html>
